<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 300"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#0f172a"/></linearGradient><linearGradient id="accent-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#6366f1"/><stop offset="50%" stop-color="#a855f7"/><stop offset="100%" stop-color="#ec4899"/></linearGradient><linearGradient id="glow-grad" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#6366f1" stop-opacity=".3"/><stop offset="100%" stop-color="#6366f1" stop-opacity="0"/></linearGradient><style>@keyframes wave{0%{transform:scaleY(.4)}}@keyframes float{0%{transform:translateY(0)}}.pulse-line{stroke-dasharray:800;stroke-dashoffset:800;animation:dash 6s linear infinite}.wave-bar{animation:wave 3s ease-in-out infinite alternate;transform-origin:bottom}.bar-1{animation-delay:.1s}.bar-2{animation-delay:.4s}.bar-3{animation-delay:.2s}.bar-4{animation-delay:.6s}.bar-5{animation-delay:.3s}.floating-node{animation:float 4s ease-in-out infinite alternate}.node-2{animation-delay:1.5s}</style></defs><rect width="1200" height="300" fill="url(#bg-grad)" rx="16"/><g opacity=".15"><path stroke="#94a3b8" stroke-width="1" d="M 0,50 L 1200,50 M 0,100 L 1200,100 M 0,150 L 1200,150 M 0,200 L 1200,200 M 0,250 L 1200,250"/><path stroke="#94a3b8" stroke-width="1" d="M 150,0 L 150,300 M 300,0 L 300,300 M 450,0 L 450,300 M 600,0 L 600,300 M 750,0 L 750,300 M 900,0 L 900,300 M 1050,0 L 1050,300"/></g><path fill="none" stroke="url(#accent-grad)" stroke-width="3" d="M 50,220 L 250,220 L 290,170 L 330,250 L 370,140 L 410,240 L 450,220 L 1150,220" class="pulse-line" opacity=".4"/><g opacity=".25"><circle cx="150" cy="80" r="35" fill="none" stroke="#6366f1" stroke-width="2" class="floating-node"/><circle cx="150" cy="80" r="8" fill="#6366f1" class="floating-node"/><circle cx="1050" cy="90
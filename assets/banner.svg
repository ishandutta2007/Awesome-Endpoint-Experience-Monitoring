<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>

    <!-- Animated Elements in Background -->
    <style>
      .pulse-line {
        stroke-dasharray: 800;
        stroke-dashoffset: 800;
        animation: dash 6s linear infinite;
      }
      .wave-bar {
        animation: wave 3s ease-in-out infinite alternate;
        transform-origin: bottom;
      }
      .bar-1 { animation-delay: 0.1s; }
      .bar-2 { animation-delay: 0.4s; }
      .bar-3 { animation-delay: 0.2s; }
      .bar-4 { animation-delay: 0.6s; }
      .bar-5 { animation-delay: 0.3s; }

      .floating-node {
        animation: float 4s ease-in-out infinite alternate;
      }
      .node-2 { animation-delay: 1.5s; }
      .node-3 { animation-delay: 2.5s; }

      @keyframes dash {
        to {
          stroke-dashoffset: 0;
        }
      }
      @keyframes wave {
        0% { transform: scaleY(0.4); }
        100% { transform: scaleY(1.1); }
      }
      @keyframes float {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-12px); }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" rx="16" fill="url(#bg-grad)"/>

  <!-- Background Grid & Dynamic Graphic Elements (Behind Text) -->
  <g opacity="0.15">
    <path d="M 0,50 L 1200,50 M 0,100 L 1200,100 M 0,150 L 1200,150 M 0,200 L 1200,200 M 0,250 L 1200,250" stroke="#94a3b8" stroke-width="1"/>
    <path d="M 150,0 L 150,300 M 300,0 L 300,300 M 450,0 L 450,300 M 600,0 L 600,300 M 750,0 L 750,300 M 900,0 L 900,300 M 1050,0 L 1050,300" stroke="#94a3b8" stroke-width="1"/>
  </g>

  <!-- Dynamic Heartbeat Line (Background) -->
  <path class="pulse-line" d="M 50,220 L 250,220 L 290,170 L 330,250 L 370,140 L 410,240 L 450,220 L 1150,220" fill="none" stroke="url(#accent-grad)" stroke-width="3" opacity="0.4"/>

  <!-- Dynamic Graphic Pills & Nodes (Background floating visuals) -->
  <g opacity="0.25">
    <!-- Floating Node 1 -->
    <circle class="floating-node" cx="150" cy="80" r="35" fill="none" stroke="#6366f1" stroke-width="2"/>
    <circle class="floating-node" cx="150" cy="80" r="8" fill="#6366f1"/>

    <!-- Floating Node 2 -->
    <circle class="floating-node node-2" cx="1050" cy="90" r="45" fill="none" stroke="#a855f7" stroke-width="2"/>
    <circle class="floating-node node-2" cx="1050" cy="90" r="12" fill="#a855f7"/>

    <!-- Wave Chart in corner -->
    <g transform="translate(950, 210)" fill="url(#accent-grad)">
      <rect class="wave-bar bar-1" x="0" y="-60" width="8" height="60" rx="4"/>
      <rect class="wave-bar bar-2" x="14" y="-80" width="8" height="80" rx="4"/>
      <rect class="wave-bar bar-3" x="28" y="-45" width="8" height="45" rx="4"/>
      <rect class="wave-bar bar-4" x="42" y="-95" width="8" height="95" rx="4"/>
      <rect class="wave-bar bar-5" x="56" y="-70" width="8" height="70" rx="4"/>
    </g>
  </g>

  <!-- Foreground Title and Subtitle -->
  <g text-anchor="middle">
    <!-- Top Badge -->
    <rect x="440" y="35" width="320" height="28" rx="14" fill="#1e293b" stroke="#6366f1" stroke-width="1.5"/>
    <text x="600" y="54" fill="#a5b4fc" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">CURATED DEX & EEM ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="600" y="125" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
      Awesome Endpoint Experience Monitoring
    </text>

    <!-- Subtitle -->
    <text x="600" y="170" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="400">
      Digital Employee Experience (DEX), Telemetry Pipelines & Endpoint Performance Analytics
    </text>

    <!-- Category Pills -->
    <g transform="translate(360, 205)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="130" height="32" rx="16" fill="#312e81" fill-opacity="0.8" stroke="#6366f1" stroke-width="1"/>
      <text x="65" y="21" fill="#c7d2fe" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">🖥️ DEX Platforms</text>

      <!-- Pill 2 -->
      <rect x="145" y="0" width="180" height="32" rx="16" fill="#4c1d95" fill-opacity="0.8" stroke="#a855f7" stroke-width="1"/>
      <text x="235" y="21" fill="#e9d5ff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">📊 Open-Source Telemetry</text>

      <!-- Pill 3 -->
      <rect x="340" y="0" width="140" height="32" rx="16" fill="#831843" fill-opacity="0.8" stroke="#ec4899" stroke-width="1"/>
      <text x="410" y="21" fill="#fbcfe8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">⚡ Real User Monitoring</text>
    </g>
  </g>
</svg>
